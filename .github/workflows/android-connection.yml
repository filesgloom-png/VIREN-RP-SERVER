name: VIREN RP Android Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_connection:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 "https://github.com/Southclaws/sampctl/releases/download/1.13.0/sampctl_1.13.0_linux_amd64.tar.gz" -o /tmp/sampctl.tar.gz
          tar -xzf /tmp/sampctl.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/sampctl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sampctl version

      - name: Build VIREN RP
        run: |
          sampctl ensure
          sampctl build
          test -s gamemodes/virel.amx

      - name: Install open.mp runtime dependency
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libatomic1 libatomic1:i386 tcpdump

      - name: Download open.mp runtime
        run: |
          ASSET_URL="$(curl -fsSL https://api.github.com/repos/openmultiplayer/open.mp/releases/latest | jq -r '.assets[] | select(.name == "open.mp-linux-x86.tar.gz") | .browser_download_url')"
          test -n "$ASSET_URL"
          curl -fL --retry 3 "$ASSET_URL" -o /tmp/openmp.tar.gz
          mkdir -p /tmp/openmp
          tar -xzf /tmp/openmp.tar.gz -C /tmp/openmp
          SERVER_BIN="$(find /tmp/openmp -type f -name omp-server -print -quit)"
          test -n "$SERVER_BIN"
          echo "SERVER_BIN=$SERVER_BIN" >> "$GITHUB_ENV"
          echo "OPENMP_SERVER_VERSION=$(curl -fsSL https://api.github.com/repos/openmultiplayer/open.mp/releases/latest | jq -r '.tag_name')" >> "$GITHUB_ENV"

      - name: Prepare server
        run: |
          SERVER_DIR="$(dirname "$SERVER_BIN")"
          mkdir -p "$SERVER_DIR/gamemodes" "$SERVER_DIR/filterscripts" "$SERVER_DIR/scriptfiles/accounts"
          cp gamemodes/virel.amx "$SERVER_DIR/gamemodes/virel.amx"
          cp config.json "$SERVER_DIR/config.json"
          cp server.cfg "$SERVER_DIR/server.cfg"
          touch "$SERVER_DIR/scriptfiles/accounts/.gitkeep"
          chmod +x "$SERVER_BIN"
          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"

      - name: Start VIREN RP server on diagnostic port 17837
        run: |
          cd "$SERVER_DIR"

          # Diagnostic only: make open.mp listen on the same port used by the
          # Portwarp public endpoint, while keeping the repository config unchanged.
          jq '.network.port = 17837' config.json > config.diagnostic.json
          mv config.diagnostic.json config.json

          ./omp-server > runtime.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/viren_server.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat runtime.log
              exit 1
            fi
            if grep -q "\[VIREN\] Server core initialized." runtime.log; then
              break
            fi
            sleep 1
          done

          kill -0 "$SERVER_PID"
          grep -q "\[VIREN\] Server core initialized." runtime.log
          grep -q "\[VIREN\] v0.9 full LSPD core loaded." runtime.log
          ss -lun | grep -E ':[[:space:]]*17837[[:space:]]' || ss -lun | grep ':17837'
          echo "VIREN RP diagnostic server is running on UDP 17837."

          echo "open.mp: $OPENMP_SERVER_VERSION"

      - name: Start UDP relay 7777 to 17837
        run: |
          cat > /tmp/viren_udp_relay.py <<'PY'
          import socket
          import threading

          LISTEN = ("127.0.0.1", 7777)
          SERVER = ("127.0.0.1", 17837)

          client_sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          server_sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          client_sock.bind(LISTEN)

          last_client = {"addr": None}

          def from_client():
              while True:
                  data, addr = client_sock.recvfrom(65535)
                  last_client["addr"] = addr
                  server_sock.sendto(data, SERVER)

          def from_server():
              while True:
                  data, addr = server_sock.recvfrom(65535)
                  target = last_client["addr"]
                  if target:
                      client_sock.sendto(data, target)

          threading.Thread(target=from_client, daemon=True).start()
          threading.Thread(target=from_server, daemon=True).start()

          print("VIREN UDP diagnostic relay: 127.0.0.1:7777 <-> 127.0.0.1:17837", flush=True)
          threading.Event().wait()
          PY

          python3 /tmp/viren_udp_relay.py > /tmp/viren-relay.log 2>&1 &
          echo $! > /tmp/viren_relay.pid
          sleep 2
          sudo ss -lunp | grep -E ':7777|:17837' || true

      - name: Start UDP packet capture
        run: |
          sudo tcpdump -ni any 'udp port 7777 or udp port 17837' -s 0 -U -C 10 -W 5 -w /tmp/viren-udp.pcap > /tmp/tcpdump.log 2>&1 &
          echo $! > /tmp/tcpdump.pid
          sleep 2
          sudo ss -uapn | grep -E ':7777|:17837' || true

      - name: Install Portwarp CLI
        run: |
          curl -fsSL https://portwarp.com/download/install.sh | bash
          command -v pwrp
          pwrp version

      - name: Sign in to Portwarp
        env:
          PORTWARP_EMAIL: ${{ secrets.PORTWARP_EMAIL }}
          PORTWARP_PASSWORD: ${{ secrets.PORTWARP_PASSWORD }}
        run: |
          test -n "$PORTWARP_EMAIL"
          test -n "$PORTWARP_PASSWORD"
          printf '%s\n%s\n' "$PORTWARP_EMAIL" "$PORTWARP_PASSWORD" | pwrp login --legacy
          pwrp status

      - name: Connect Portwarp UDP tunnel
        run: |
          pwrp tunnels
          pwrp connect --all --detach
          sleep 5
          pwrp ps --once

      - name: Verify server and tunnel stay alive
        run: |
          for i in $(seq 1 330); do
            SERVER_PID="$(cat /tmp/viren_server.pid)"

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "VIREN RP server stopped."
              cat "$SERVER_DIR/runtime.log"
              exit 1
            fi

            if ! pwrp ps --once; then
              echo "Portwarp tunnel session is not healthy."
              pwrp logs --tail 50 || true
              exit 1
            fi

            if [ "$((i % 10))" -eq 0 ]; then
              echo "[$i min] VIREN RP server + Portwarp tunnel are alive."
              pwrp ps --once || true
              tail -n 20 "$SERVER_DIR/runtime.log" || true
            fi

            sleep 60
          done

      - name: Final logs
        if: always()
        run: |
          echo "===== VIREN RUNTIME LOG ====="
          cat "$SERVER_DIR/runtime.log" 2>/dev/null || true
          echo "===== PORTWARP STATUS ====="
          pwrp status 2>/dev/null || true
          pwrp ps --once 2>/dev/null || true
          pwrp logs --tail 100 2>/dev/null || true
          echo "===== TCPDUMP LOG ====="
          cat /tmp/tcpdump.log 2>/dev/null || true
          echo "===== UDP RELAY LOG ====="
          cat /tmp/viren-relay.log 2>/dev/null || true
          echo "===== UDP SOCKETS ====="
          sudo ss -uapn || true

      - name: Upload network diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIREN-RP-network-diagnostics
          path: |
            /tmp/viren-udp.pcap*
            /tmp/tcpdump.log
            /tmp/viren-relay.log
          if-no-files-found: warn
