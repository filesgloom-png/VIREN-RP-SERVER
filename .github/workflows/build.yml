name: VIREN RP Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sampctl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 "https://github.com/Southclaws/sampctl/releases/download/1.13.0/sampctl_1.13.0_linux_amd64.tar.gz" -o /tmp/sampctl.tar.gz
          tar -xzf /tmp/sampctl.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/sampctl"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v sampctl
          sampctl version

      - name: Ensure dependencies
        run: sampctl ensure

      - name: Build gamemode
        run: sampctl build

      - name: Verify AMX artifact
        run: |
          test -s gamemodes/virel.amx
          file gamemodes/virel.amx

      - name: Upload gamemode
        uses: actions/upload-artifact@v4
        with:
          name: VIREN-RP-gamemode
          path: gamemodes/virel.amx
          if-no-files-found: error
